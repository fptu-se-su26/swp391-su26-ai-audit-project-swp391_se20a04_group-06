services:
  # 🌟 Cập nhật cơ sở dữ liệu sang MongoDB
  db:
    image: mongo:latest
    container_name: seafood_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: seafood_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seafood_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://db:27017/seafood_db # 🌟 Trỏ uri kết nối tới container db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      ALLOW_MOCK_AUTH: "true"
      NODE_ENV: "development"
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: seafood_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
